<!doctype html>
<html lang="pt-pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lógica de Programação JavaScript</title>
  </head>
  <body>
    <h1>Lógica de Programação JavaScript</h1>

    <script>
      var numero = parseInt(numero);
      numero = 1;
      while (numero <= 5) {
        document.write(numero + "<br>");

        numero += 1;
      }
    </script>
  </body>
</html>
