<!doctype html>
<html lang="pt-pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercício Extra 1</title>
  </head>
  <body>
    <script>
      var n1 = prompt("Digite um número");
      n1 = parseInt(n1);
      var n2 = prompt("Digite outro número");
      n2 = parseInt(n2);
      var n3 = prompt("Digite mais um número");
      n3 = parseInt(n3);

      alert("A soma é: " + (n1 + n2 + n3));
      alert("A subtração é: " + (n1 - n2 - n3));
      alert("A multiplicação é: " + n1 * n2 * n3);
    </script>
  </body>
</html>
