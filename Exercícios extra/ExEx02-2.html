<!doctype html>
<html lang="pt-pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lógica de Programação JavaScript</title>
  </head>
  <body>
    <h1>Lógica de Programação JavaScript</h1>

    <script>
      var n1 = parseInt(prompt("Quantas pessoas são?"));
      var n2 = parseInt(prompt("Quantos doces tem?"));
      var resultado = n2 % n1;
      var dp = n2 / n1; //dp = doce por pessoa
      alert("Cada pessoa recebe " + dp + " doces");
      alert("Sobram " + resultado + " doces");
    </script>
  </body>
</html>
