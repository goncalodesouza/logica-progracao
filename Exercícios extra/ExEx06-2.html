<!doctype html>
<html lang="pt-pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lógica de Programação JavaScript</title>
  </head>
  <body>
    <h1>Lógica de Programação JavaScript</h1>

    <script>
      var numero1 = prompt("Digite um número");
      numero1 = parseInt(numero1);

      if (numero1 > 0) {
        document.write("É positivo");
      } else {
        if (numero1 === 0) {
          document.write("É zero");
        } else if (numero1 < 0) {
          document.write("É negativo");
        }
      }
    </script>
  </body>
</html>
