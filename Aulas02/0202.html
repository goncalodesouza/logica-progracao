<!doctype html>
<html lang="pt-pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lógica de programação JavaScript</title>
  </head>
  <body>
    <h1>Lógica de programação JavaScript</h1>

    <script>
      // pedir para o usuário digitar um número
      var n1 = prompt("Digite um número");
      n1 = parseFloat(n1);
      // pedir para o usuário digitar outro número
      var n2 = prompt("Digite outro número");
      n2 = parseFloat(n2);
      // mostrar resultado
      alert(n1 + n2);
    </script>
  </body>
</html>
