<!doctype html>
<html lang="pt-pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lógica de Programação JavaScript</title>
  </head>
  <body>
    <h1>Lógica de Programação JavaScript</h1>

    <script>
      var n1 = prompt("Digita um número");
      n1 = parseInt(n1);

      switch (n1) {
        case 1:
          alert("Boa escolha");
          break;
        case 2:
          alert("Top");
          break;
        case 3:
          alert("Incrível");
          break;
        default:
          alert("Escolha um número de 1 a 3");
      }
    </script>
  </body>
</html>
