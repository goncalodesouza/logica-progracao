<!doctype html>
<html lang="pt-pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lógica de Programação JavaScript</title>
  </head>
  <body>
    <h1>Lógica de Programação JavaScript</h1>

    <script>
      var n1 = parseInt(prompt("Digite um número"));
      var n2 = parseInt(prompt("Digite um número"));
      parseInt(Math.random() * 2);
      if (n1 == n2) {
        alert("Empate");
      } else {
        var nSorteio = parseInt(Math.random() * 2);
        if (nSorteio === 0) {
          if (n1 < n2) {
            alert("N1 ganhou");
          } else {
            alert("N2 ganhou");
          }
        } else {
          if (n1 > n2) {
            alert("N1 ganhou");
          } else {
            alert("N2 ganhou");
          }
        }
      }
    </script>
  </body>
</html>
