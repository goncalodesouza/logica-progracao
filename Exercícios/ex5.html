<!doctype html>
<html lang="pt-pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lógica de Programação JavaScript</title>
  </head>
  <body>
    <h1>Lógica de Programação JavaScript</h1>

    <script>
      var n1 = parseFloat(prompt("Digite um número"));
      var n2 = parseFloat(prompt("Digite outro número"));
      if (n1 === n2) {
        alert("Empate");
      } else {
        var nSorteio = parseInt(Math.random() * 2);
        alert("nSorteio: " + nSorteio);
      }
      if ((nSorteio === 0 && n1 < n2) || (nSorteio === 1 && n1 > 2)) {
        alert("n1 ganhou");
      } else {
        alert("n2 ganhou");
      }
    </script>
  </body>
</html>
